name: SimpleLedger
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  SimpleLedger:
    type: application
    platform: iOS
    sources:
      - MoneyApp.swift
      - LedgerTabs.swift
      - EntryEditor.swift
      - QuickEntryIntent.swift
      - WidgetData.swift
      - Assets.xcassets
    dependencies:
      - target: LedgerWidget
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [simpleledger]
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.miles1610.simpleledger]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miles1610.simpleledger
        PRODUCT_NAME: SimpleLedger
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 记账
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
  LedgerWidget:
    type: app-extension
    platform: iOS
    sources:
      - LedgerWidget.swift
      - QuickEntryIntent.swift
      - WidgetData.swift
    info:
      path: Generated/Widget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.miles1610.simpleledger]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miles1610.simpleledger.widget
        PRODUCT_NAME: LedgerWidget
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 快速记账
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
