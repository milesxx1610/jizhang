name: SimpleLedger
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  SimpleLedger:
    type: application
    platform: iOS
    sources:
      - MoneyApp.swift
      - LedgerTabs.swift
      - EntryEditor.swift
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miles1610.simpleledger
        PRODUCT_NAME: SimpleLedger
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 记账
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
