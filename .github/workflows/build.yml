name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)
          test -n "$XCODE_PATH" || { echo 'Xcode 26 is required'; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift Icon.swift
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Build and package
        run: |
          set -euo pipefail
          xcodebuild -project SimpleLedger.xcodeproj -scheme SimpleLedger -configuration Release -derivedDataPath "$RUNNER_TEMP/build" -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/build/Build/Products/Release-iphoneos/SimpleLedger.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qr SimpleLedger-unsigned.ipa Payload
          unzip -t SimpleLedger-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLedger-unsigned
          path: ${{ runner.temp }}/package/SimpleLedger-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Preview on simulator
        continue-on-error: true
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for k,v in d["devices"].items() if "iOS-26" in k for x in v if "iPhone" in x["name"]), ""))')
          test -n "$DEVICE" || { echo 'No iOS 26 simulator available'; exit 1; }
          xcodebuild -project SimpleLedger.xcodeproj -scheme SimpleLedger -configuration Debug -derivedDataPath "$RUNNER_TEMP/simulator-build" -destination "platform=iOS Simulator,id=$DEVICE" build CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/simulator-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/simulator-build.log"; exit 1; }
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/simulator-build/Build/Products/Debug-iphonesimulator/SimpleLedger.app"
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl launch "$DEVICE" com.miles1610.simpleledger
          sleep 5
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/light.png"
          xcrun simctl ui "$DEVICE" appearance dark
          sleep 3
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/dark.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Simulator-previews
          path: |
            ${{ runner.temp }}/light.png
            ${{ runner.temp }}/dark.png
          if-no-files-found: ignore

